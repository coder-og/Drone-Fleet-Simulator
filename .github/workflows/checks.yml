name: Build and core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B compile
      - run: javac -cp target/classes -d target/test-classes tests/CoreChecks.java
      - run: java -cp target/classes:target/test-classes application.CoreChecks
